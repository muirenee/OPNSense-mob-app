name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_KEY_ALIAS: netsource-sentinel
      EXPECTED_KEYSTORE_SHA256: 2c190e6d58bb4d43678100cf14ca2dd51c08202e7b30b869e370ef075020b804
      EXPECTED_RELEASE_CERT_SHA256: 8f6a384f612aa0d480dce388737dcf7441fc4619581b20bdb226e52ca4316e0d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Prepare permanent release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            KEYSTORE_PATH=android/app/netsource-sentinel-release.jks
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

            ACTUAL_KEYSTORE_SHA256=$(sha256sum "$KEYSTORE_PATH" | awk '{print tolower($1)}')
            if [ "$ACTUAL_KEYSTORE_SHA256" != "$EXPECTED_KEYSTORE_SHA256" ]; then
              echo "Decoded keystore does not match the permanent Netsource Sentinel v3 keystore." >&2
              echo "Expected keystore SHA-256: $EXPECTED_KEYSTORE_SHA256" >&2
              echo "Actual keystore SHA-256:   $ACTUAL_KEYSTORE_SHA256" >&2
              exit 1
            fi

            if [ "$KEY_ALIAS" != "$EXPECTED_KEY_ALIAS" ]; then
              echo "ANDROID_KEY_ALIAS is incorrect. Expected: $EXPECTED_KEY_ALIAS" >&2
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$EXPECTED_KEY_ALIAS" >/dev/null 2>&1; then
              echo "The v3 keystore and alias are correct, but ANDROID_KEYSTORE_PASSWORD is incorrect." >&2
              exit 1
            fi

            CHECK_STORE="$RUNNER_TEMP/sentinel-signing-check.p12"
            rm -f "$CHECK_STORE"
            if ! keytool -importkeystore \
              -srckeystore "$KEYSTORE_PATH" \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$EXPECTED_KEY_ALIAS" \
              -srckeypass "$KEY_PASSWORD" \
              -destkeystore "$CHECK_STORE" \
              -deststoretype PKCS12 \
              -deststorepass 'SentinelCiCheck123!' \
              -destkeypass 'SentinelCiCheck123!' \
              -noprompt >/dev/null 2>&1; then
              echo "The v3 keystore, alias and store password are correct, but ANDROID_KEY_PASSWORD is incorrect." >&2
              exit 1
            fi
            rm -f "$CHECK_STORE"

            cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${EXPECTED_KEY_ALIAS}
          storeFile=netsource-sentinel-release.jks
          EOF
            echo "Permanent Netsource Sentinel v3 signing key and credentials verified."
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Permanent release signing secrets are required for main/manual builds." >&2
            exit 1
          else
            echo "PR CI: signing secrets are unavailable, so this validation build may use the runner debug key."
          fi

      - name: Build release APK
        env:
          SENTINEL_REQUIRE_RELEASE_SIGNING: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        run: flutter build apk --release

      - name: Verify APK and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          sha256sum "$APK"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
            CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
            printf '%s\n' "$CERT_OUTPUT"
            ACTUAL_CERT_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/certificate SHA-256 digest/{print tolower($2); exit}')
            if [ -z "$ACTUAL_CERT_SHA256" ]; then
              echo "Unable to read the APK signing certificate fingerprint." >&2
              exit 1
            fi
            if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
              echo "APK signing certificate does not match the permanent Netsource Sentinel v3 certificate." >&2
              echo "Expected: $EXPECTED_RELEASE_CERT_SHA256" >&2
              echo "Actual:   $ACTUAL_CERT_SHA256" >&2
              exit 1
            fi
            echo "Permanent Netsource Sentinel v3 release certificate verified."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netsource-sentinel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
