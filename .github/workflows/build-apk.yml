name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_RELEASE_CERT_SHA256: 8f6a384f612aa0d480dce388737dcf7441fc4619581b20bdb226e52ca4316e0d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Prepare permanent release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/netsource-sentinel-release.jks
            cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=netsource-sentinel-release.jks
          EOF
            echo "Permanent Netsource Sentinel signing key prepared."
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Permanent release signing secrets are required for main/manual builds." >&2
            exit 1
          else
            echo "PR CI: signing secrets are unavailable, so this validation build may use the runner debug key."
          fi

      - name: Build release APK
        env:
          SENTINEL_REQUIRE_RELEASE_SIGNING: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        run: flutter build apk --release

      - name: Verify APK and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          sha256sum "$APK"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
            CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
            printf '%s\n' "$CERT_OUTPUT"
            ACTUAL_CERT_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/certificate SHA-256 digest/{print tolower($2); exit}')
            if [ -z "$ACTUAL_CERT_SHA256" ]; then
              echo "Unable to read the APK signing certificate fingerprint." >&2
              exit 1
            fi
            if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
              echo "APK signing certificate does not match the permanent Netsource Sentinel v3 certificate." >&2
              echo "Expected: $EXPECTED_RELEASE_CERT_SHA256" >&2
              echo "Actual:   $ACTUAL_CERT_SHA256" >&2
              exit 1
            fi
            echo "Permanent Netsource Sentinel release certificate verified."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netsource-sentinel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
